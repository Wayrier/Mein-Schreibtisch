name: PHP Syntax Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql

      - name: Lint PHP files
        shell: bash
        run: |
          mapfile -d '' files < <(find "PHP Aufgabe" -type f -name "*.php" -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            php -l "$file"
          done
